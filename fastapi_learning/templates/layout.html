<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind Configuration for customization -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#3b82f6',
                            DEFAULT: '#2563eb',
                            dark: '#1d4ed8',
                        },
                    }
                }
            }
        }
    </script>
    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
    
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/img/logo.svg') }}">
    <link rel="manifest" href="{{ url_for('static', path='/site.webmanifest') }}">
    <meta name="theme-color" content="#2563eb">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', path='/css/main.css') }}">
    
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-slate-50 text-slate-900 antialiased transition-colors duration-300 dark:bg-slate-900 dark:text-slate-100;
            }
        }
        @layer components {
            .card {
                @apply bg-white dark:bg-slate-800 p-6 rounded-lg shadow-md border-l-4 border-brand transition-all duration-300 hover:shadow-lg hover:-translate-y-1;
            }
            .btn-brand {
                @apply bg-brand text-white px-4 py-2 rounded-md text-sm font-semibold hover:bg-brand-dark transition-all hover:shadow-md active:scale-95;
            }
        }
    </style>
    <title>FastAPI Blog | {{ title }}</title>
</head>
<body class="flex flex-col min-h-screen">

    <!-- Accessible Header & Navigation -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 dark:bg-slate-800/80 dark:border-slate-700">
        <nav class="container mx-auto px-4 sm:px-6 lg:px-8" aria-label="Main Navigation">
            <div class="flex justify-between h-16 items-center">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center">
                    <a href="{{ url_for('home') }}" class="flex items-center space-x-3 group">
                        <img src="{{ url_for('static', path='/img/logo.svg') }}" alt="Logo" class="w-8 h-8 group-hover:rotate-12 transition-transform">
                        <span class="text-xl font-extrabold tracking-tight text-slate-900 dark:text-white">FastAPI<span class="text-brand">Blog</span></span>
                    </a>
                </div>

                <!-- Navigation Links & Theme Toggle -->
                <div class="flex items-center space-x-4">
                    <div class="hidden sm:flex sm:space-x-8 mr-4">
                        <a href="{{ url_for('home') }}" class="inline-flex items-center px-1 pt-1 border-b-2 border-brand text-sm font-medium text-slate-900 dark:text-white transition-colors">
                            Home
                        </a>
                        <a href="{{ url_for('get_posts') }}" class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium text-slate-500 hover:text-slate-700 hover:border-slate-300 dark:text-slate-400 dark:hover:text-slate-200 transition-all">
                            API
                        </a>
                    </div>

                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle" type="button" class="text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 focus:outline-none focus:ring-4 focus:ring-slate-200 dark:focus:ring-slate-700 rounded-lg text-sm p-2.5 transition-all">
                        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    </button>

                    <!-- Action Button -->
                    <button class="btn-brand">
                        New Post
                    </button>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="max-w-4xl mx-auto animate-fade-in">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Semantic Footer -->
    <footer class="bg-white border-t border-slate-200 dark:bg-slate-800 dark:border-slate-700">
        <div class="container mx-auto px-4 py-8 flex flex-col md:flex-row justify-between items-center text-slate-500 dark:text-slate-400 text-sm">
            <p>&copy; 2026 FastAPI Learning Track. All rights reserved.</p>
            <div class="flex space-x-6 mt-4 md:mt-0">
                <a href="#" class="hover:text-brand transition-colors">Documentation</a>
                <a href="#" class="hover:text-brand transition-colors">GitHub</a>
                <a href="#" class="hover:text-brand transition-colors">Privacy</a>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="{{ url_for('static', path='/js/utils.js') }}"></script>

</body>
</html>
